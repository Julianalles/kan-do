- region "Kurz erklärt":
  - heading "Kurz erklärt" [level=2]
  - paragraph: Hinweise zum Einstieg
  - paragraph: Kurze Hinweise auf dem Board zeigen dir den nächsten Schritt.
  - button "Ausschalten"
  - list:
    - listitem:
      - heading "Anfangen" [level=3]
      - paragraph: Ziehe in „Jetzt“, woran du gerade arbeitest. In Jetzt liegt immer nur eine Aufgabe.
    - listitem:
      - heading "Weitermachen" [level=3]
      - paragraph: Die Zeit läuft jetzt mit. Ziehe die Karte in „Erledigt“, sobald die Aufgabe erledigt ist. Wartest du auf jemanden, ziehe sie in „Wartet“.
    - listitem:
      - heading "Auswählen" [level=3]
      - paragraph: Viel offen? Gestapelt nach Thema oder Priorität wählst du leichter aus. Die Stapel findest du auch unter „Mehr“.
    - listitem:
      - heading "Tag abschließen" [level=3]
      - paragraph: Genug für heute? „Tag abschließen“ zeigt dir, was du geschafft hast und was offen bleibt.
    - listitem:
      - heading "Planen" [level=3]
      - paragraph: Der Pfeil an einer Karte plant sie für heute ein. Wechsle zu „Heute“, sobald du loslegen willst.