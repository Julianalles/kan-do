- region "Mit Notion verbinden":
  - list "Fortschritt der Einrichtung":
    - listitem: Vorbereitung (abgeschlossen)
    - listitem: Token (abgeschlossen)
    - listitem: Datenbank
    - listitem: Eigenschaften
    - listitem: Weitere Eigenschaften
    - listitem: Status
  - paragraph: Wähle die Datenbank mit deinen Aufgaben. Die Datenbank muss mit deiner Integration geteilt sein.
  - group "Datenbank":
    - text: Notion-Datenbank auswählen
    - combobox "Notion-Datenbank auswählen": Demo Aufgaben
