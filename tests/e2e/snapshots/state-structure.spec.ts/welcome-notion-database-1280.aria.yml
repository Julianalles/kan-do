    - list "Nötig":
      - listitem: Titel
      - listitem: Status
    - text: Optional
    - list "Optional":
      - listitem: Fälligkeit
      - listitem: Priorität
      - listitem: Timebox
      - listitem: Aufgewendete Zeit
