- paragraph: Welche Listen soll Kan-do lesen?
- paragraph: Ist eine Liste an, wird ihr Name zum Thema ihrer Aufgaben, etwa Steuer oder Wohnung. Ist sie aus, liest Kan-do sie nicht. In Apple Erinnerungen bleibt sie, wie sie ist.
- list "Listen aus Apple Erinnerungen":
  - listitem:
    - text: Zuhause 2 offen
    - switch "Zuhause lesen" [checked]
  - listitem:
    - text: Arbeit 1 offen
    - switch "Arbeit lesen" [checked]
  - listitem:
    - text: Privat Wird nicht gelesen
    - switch "Privat lesen"