- region "Listen":
  - heading "Listen" [level=2]
  - list "Erinnerungen-Listen":
    - listitem:
      - text: Zuhause Wird nicht gelesen
      - radiogroup "Zuhause zählt als":
        - radio "Thema"
        - radio "Aktivität"
        - radio "Aus" [checked]
      - group "Zuhause nicht mehr lesen?":
        - paragraph: Zuhause nicht mehr lesen? 3 Aufgaben verlassen Kan-Do, 3 davon stehen heute auf dem Board. In Erinnerungen bleibt alles, wie es ist.
        - button "Nicht mehr lesen"
        - button "Abbrechen"
    - listitem:
      - text: Arbeit 1 offen
      - radiogroup "Arbeit zählt als":
        - radio "Thema"
        - radio "Aktivität" [checked]
        - radio "Aus"
    - listitem:
      - text: Privat Wird nicht gelesen
      - radiogroup "Privat zählt als":
        - radio "Thema"
        - radio "Aktivität"
        - radio "Aus" [checked]
  - paragraph: "Thema: worum es geht, etwa Steuer oder Wohnung. Aktivität: wie du arbeitest, etwa Anrufe. Aus: Kan-Do liest die Liste nicht, in Erinnerungen bleibt sie, wie sie ist."
- region "Heute":
  - heading "Heute" [level=2]
  - paragraph: Das Datum in Erinnerungen entscheidet, was heute auf dein Board kommt.
  - table "Datum und Board":
    - caption: Datum und Board
    - rowgroup:
      - row "Heute Auf dem Board":
        - rowheader "Heute"
        - cell "Auf dem Board"
      - row "Gestern oder früher In Meine Aufgaben":
        - rowheader "Gestern oder früher"
        - cell "In Meine Aufgaben"
      - row "Morgen oder später In Meine Aufgaben":
        - rowheader "Morgen oder später"
        - cell "In Meine Aufgaben"
      - row "Kein Datum In Meine Aufgaben":
        - rowheader "Kein Datum"
        - cell "In Meine Aufgaben"
  - paragraph: Planst du in Kan-Do eine Aufgabe für heute ein, setzt Kan-Do ihr Datum auf heute. Uhrzeit und Erinnerungen bleiben. Rückgängig im Hinweis stellt das alte Datum wieder her.
- region "Zugriff":
  - heading "Zugriff" [level=2]
  - paragraph: Kan-Do darf auf Erinnerungen zugreifen.
  - button "Systemeinstellungen öffnen"
  - button "Trennen"